services:
  db:
    image: postgres:16
    container_name: excel_insider_db
    environment:
      POSTGRES_DB: excel_insider
      POSTGRES_USER: excel_user
      POSTGRES_PASSWORD: excel_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: excel_insider_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata: